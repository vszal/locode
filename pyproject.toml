[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locode"
version = "0.1.0"
description = "A Claude Code-style agentic CLI for local LLMs served by mlx_lm.server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "locode" }]
dependencies = [
    "httpx>=0.27",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
locode = "locode.cli:main"

[tool.setuptools.packages.find]
include = ["locode*"]

# The bench cases are data, not modules: seeds, prompts, graders. Without this
# they are silently dropped from the wheel and `locode bench` ships with an
# empty ladder -- which is exactly the failure the whole feature exists to fix.
[tool.setuptools.package-data]
"locode.bench" = ["cases/**/*"]

# ...but not the caches. Running a grader (or pytest over the seeds) leaves
# __pycache__ and .pytest_cache inside the case dirs, and the glob above would
# ship whatever happened to be on the build machine's disk.
[tool.setuptools.exclude-package-data]
"locode.bench" = [
    "cases/**/__pycache__/*",
    "cases/**/.pytest_cache/*",
    "cases/**/*.pyc",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
